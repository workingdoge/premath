[workspace]
resolver = "2"
members = [
    "crates/premath-kernel",
    "crates/premath-coherence",
    "crates/premath-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/premath/premath"
description = "Premath: an admissibility kernel for definability by contractible descent"

[workspace.dependencies]
# Internal crates
premath-kernel = { path = "crates/premath-kernel" }
premath-coherence = { path = "crates/premath-coherence" }

# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
insta = { version = "1", features = ["json"] }
