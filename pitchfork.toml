# Optional orchestration layer for local coding-runtime processes.
# CI scripts remain the canonical gate semantics.

[daemons.docs-preview]
run = "python3 -m http.server 43173"
dir = "docs"
ready_delay = 1
auto = ["start", "stop"]

[daemons.observation-api]
run = "sh -lc 'sh tools/ci/run_task.sh ci-observation-build && sh tools/ci/run_task.sh ci-observation-serve'"
ready_delay = 2

[daemons.gate-check-loop]
run = "sh -lc 'while true; do python3 tools/ci/run_required_attested.py; sleep 1800; done'"
ready_delay = 1
